<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Stay — CityPlace bnb Aparthotel</title>
    <meta name="robots" content="noindex">
    <meta name="description" content="Book CityPlace bnb Aparthotel through our booking channels.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f7f8fa; color: #2c3e50; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 24px;
        }
        .card {
            background: #fff; max-width: 520px; width: 100%; border-radius: 14px;
            box-shadow: 0 10px 40px rgba(44,62,80,.12); padding: 40px 36px; text-align: center;
        }
        h1 { font-size: 1.45rem; margin-bottom: 10px; }
        p.lede { color: #5c6b7a; line-height: 1.55; margin-bottom: 26px; font-size: .98rem; }
        .channels { display: flex; flex-direction: column; gap: 12px; margin-bottom: 26px; }
        .channels a {
            display: block; padding: 14px 18px; border-radius: 10px; text-decoration: none;
            font-weight: 600; font-size: 1rem; color: #fff; background: #2c3e50;
            transition: transform .12s ease, opacity .12s ease;
        }
        .channels a:hover { transform: translateY(-1px); opacity: .92; }
        .channels a.airbnb { background: #e0565b; }
        .channels a.booking { background: #01357a; }
        .channels a.expedia { background: #1a1a66; }
        .back { color: #7a8794; font-size: .88rem; text-decoration: none; }
        .back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Book Your Stay at CityPlace bnb</h1>
        <p class="lede">Online direct booking is temporarily unavailable. Please book through
        one of our official channels below — same suites, live availability, secure checkout.</p>
        <div class="channels">
            <a class="airbnb" href="https://airbnb.com/rooms/760320417429182142" target="_blank" rel="noopener">Book on Airbnb</a>
            <a class="booking" href="https://www.booking.com/searchresults.html?ss=CityPlace+bnb+Aparthotel+Dallas" target="_blank" rel="noopener">Book on Booking.com</a>
            <a class="expedia" href="https://www.expedia.com/h95469239.Hotel-Information" target="_blank" rel="noopener">Book on Expedia</a>
        </div>
        <a class="back" href="/">&larr; Back to cityplacebnb.com</a>
    </main>
</body>
</html>
